name = "bible-api"
main = "src/index.ts"
compatibility_date = "2024-04-01"

# 1. R2 Bucket Binding
[[r2_buckets]]
binding = "BIBLE_BUCKET"
bucket_name = "bible-api-storage-v1"

# 2. KV Namespace Binding
[[kv_namespaces]]
binding = "BIBLE_KV"
id = "48496f7b175446f5a77761563cce46be"
preview_id = "7945621e446845dd997b8242ccfe9741"

# 3. Scheduled Worker (Verse of the Day - 8:30am Sydney time)
[triggers]
# Cloudflare cron is UTC. Sydney is UTC+10 (AEST) or UTC+11 (AEDT).
# This is set to 8:30am AEDT (UTC+11)
crons = ["30 21 * * *"]

# 4. Observability
[observability]
enabled = true
